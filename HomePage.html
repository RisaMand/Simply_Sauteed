<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <style>
        body {
            margin: 20px;
            margin-top: 100px;
            margin-bottom: 100px;
        }

        #mainDiv {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            row-gap: 100px;
            place-items: center;
        }
    </style>
    <title>Document</title>
</head>

<body>
    <button class="btn btn-warning" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasScrolling"
        aria-controls="offcanvasScrolling" onclick="categoryCall()">
        Filter
    </button>

    <div class="offcanvas offcanvas-end" data-bs-scroll="true" data-bs-backdrop="false" tabindex="-1"
        id="offcanvasScrolling" aria-labelledby="offcanvasScrollingLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasScrollingLabel">
                Filter on the basis of these categories
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div id="categoryList" class="offcanvas-body">
            <p>Select the categories.</p>
            <div id="categoryDiv"></div>
            <!-- <div class="form-check">
                <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
                <label class="form-check-label" for="radioDefault1">
                    Default radio
                </label>
            </div> -->
            <div>
                <button type="button" class="btn btn-warning" onclick="checkRadio()">Apply Filters</button>
            </div>
        </div>
    </div>

    <div id="liveAlertPlaceholder"></div>

    <div id="mainDiv">
        <!-- <div class="card" style="width: 18rem">
            <img src="https://4kwallpapers.com/images/walls/thumbs_3t/24890.jpg" class="card-img-top" alt="..." />
            <div class="card-body">
                <h5 class="card-title">Card title</h5>
                <p class="card-text">
                    Some quick example text to build on the card title and make up the
                    bulk of the card's content.
                </p>
                <a href="#" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#exampleModal">View Recipe
                    Details</a>
            </div>
        </div> -->
    </div>

    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Recipe</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">...</div>
                <div class="modal-footer">
                    <!-- <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button> -->
                    <!-- <button type="button" class="btn btn-primary">Save changes</button> -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        if (localStorage.getItem("allRecipes") == null) {
            apiCall();
        } else {
            var response = JSON.parse(localStorage.getItem("allRecipes"));
            for (j = 0; j < response.length; j++) {
                if (response[j] != null) {
                    for (k = 0; k < response[j].length; k++) {
                        document.getElementById("mainDiv").innerHTML =
                            document.getElementById("mainDiv").innerHTML +
                            `
                          <div class="card" style="width: 18rem">
                              <img
                              src=${response[j][k].thumbnail}
                              class="card-img-top"
                              alt="..."
                              />
                              <div class="card-body">
                                  <h5 class="card-title">${response[j][k].mealName}</h5>
                                  <p class="card-text">
                                  Category - ${response[j][k].category} <br>
                                  Area - ${response[j][k].area}
                                  </p>
                                  <a
                                      href="#"
                                      class="btn btn-warning"
                                      data-bs-toggle="modal"
                                      data-bs-target="#${response[j][k].id}"
                                      >View Recipe Details</a>
                              </div>
                          </div>`;
                        document.body.innerHTML =
                            document.body.innerHTML +
                            `
                          <div class="modal modal-xl fade" id=${response[j][k].id} tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                              <div class="modal-dialog">
                                  <div class="modal-content">
                                      <div class="modal-header">
                                          <h1 class="modal-title fs-5" id="exampleModalLabel">Recipe</h1>
                                          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                      </div>
                                      <div class="modal-body">
                                          Instructions- <br>
                                      ${response[j][k].instructions}
                                      <br><br>
                                      <a href=${response[j][k].youtubeVideo} target = "_blank" class="btn btn-danger">View Recipe
                                      Video</a>
                                      </div>
                                  </div>
                              </div>
                          </div>
                          `;
                    }
                }
            }
        }
        // fetch()->(big box of data promise)resolve(.then)->)(real data promise)resolve(.then)
        async function apiCall() {
            // var alphabetArr = [
            //   "a",
            //   "b",
            //   "c",
            //   "d",
            //   "e",
            //   "f",
            //   "g",
            //   "h",
            //   "i",
            //   "j",
            //   "k",
            //   "l",
            //   "m",
            //   "n",
            //   "o",
            //   "p",
            //   "q",
            //   "r",
            //   "s",
            //   "t",
            //   "u",
            //   "v",
            //   "w",
            //   "x",
            //   "y",
            //   "z",
            // ];
            var alphabetArr = ['a', 'b']
            var mainArr = [];
            for (i = 0; i < 26; i++) {
                mainArr.push([]);
            }

            for (i = 0; i < alphabetArr.length; i++) {
                var data = await fetch(
                    "https://www.themealdb.com/api/json/v1/1/search.php?f=" +
                    alphabetArr[i],
                );
                var response = await data.json();
                console.log(response);
                if (response.meals != null) {
                    for (j = 0; j < response.meals.length; j++) {
                        document.getElementById("mainDiv").innerHTML =
                            document.getElementById("mainDiv").innerHTML +
                            `
                              <div class="card" style="width: 18rem">
                                  <img
                                  src=${response.meals[j].strMealThumb}
                                  class="card-img-top"
                                  alt="..."
                                  />
                                  <div class="card-body">
                                      <h5 class="card-title">${response.meals[j].strMeal}</h5>
                                      <p class="card-text">
                                      Category - ${response.meals[j].strCategory} <br>
                                      Area - ${response.meals[j].strArea}
                                      </p>
                                      <a
                                          href="#"
                                          class="btn btn-warning"
                                          data-bs-toggle="modal"
                                          data-bs-target="#${response.meals[j].idMeal}"
                                          >View Recipe Details</a>
                                  </div>
                              </div>`;
                        document.body.innerHTML =
                            document.body.innerHTML +
                            `
                              <div class="modal modal-xl fade" id=${response.meals[j].idMeal} tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                                  <div class="modal-dialog">
                                      <div class="modal-content">
                                          <div class="modal-header">
                                              <h1 class="modal-title fs-5" id="exampleModalLabel">Recipe</h1>
                                              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                          </div>
                                          <div class="modal-body">
                                              Instructions- <br>
                                          ${response.meals[j].strInstructions}
                                          <br><br>
                                          <a href=${response.meals[j].strYoutube} target = "_blank" class="btn btn-danger">View Recipe
                                          Video</a>
                                          </div>
                                      </div>
                                  </div>
                              </div>
                              `;
                        var obj = {
                            id: response.meals[j].idMeal,
                            thumbnail: response.meals[j].strMealThumb,
                            mealName: response.meals[j].strMeal,
                            category: response.meals[j].strCategory,
                            area: response.meals[j].strArea,
                            instructions: response.meals[j].strInstructions,
                            youtubeVideo: response.meals[j].strYoutube,
                        };

                        if (localStorage.getItem("allRecipes") != null) {
                            mainArr = JSON.parse(localStorage.getItem("allRecipes"));
                        }
                        mainArr[i].push(obj);
                        localStorage.setItem("allRecipes", JSON.stringify(mainArr));
                    }
                }
            }
        }

        async function categoryCall() {
            var data = await fetch(
                "https://www.themealdb.com/api/json/v1/1/categories.php"
            );
            var response = await data.json();
            var categoriesArray = response.categories
            var htmlRes = ""
            for (i = 0; i < categoriesArray.length; i++) {
                htmlRes = htmlRes + `<div class="form-check">
                            <input class="form-check-input" type="radio" name="radioDefault" id=${categoriesArray[i].strCategory} value=${categoriesArray[i].strCategory}>
                            <label class="form-check-label" for="radioDefault1">
                                ${categoriesArray[i].strCategory}
                            </label>
                        </div>`
            }

            document.getElementById("categoryDiv").innerHTML = htmlRes
        }

        function checkRadio() {
            var selectedCat = ""
            var radioArray = document.getElementsByName("radioDefault")
            for (i = 0; i < radioArray.length; i++) {
                if (radioArray[i].checked == true) {
                    selectedCat = radioArray[i].value;
                }
            }

            if (selectedCat != "") {
                categoryFilter(selectedCat)
            }
            else {
                const alertPlaceholder = document.getElementById('liveAlertPlaceholder')
                const appendAlert = (message, type) => {
                    const wrapper = document.createElement('div')
                    wrapper.innerHTML = [
                        `<div class="alert alert-${type} alert-dismissible" role="alert">`,
                        `   <div>${message}</div>`,
                        '   <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
                        '</div>'
                    ].join('')

                    alertPlaceholder.append(wrapper)
                }
                appendAlert('You have not selected any category to apply filters', 'Danger')
            }
        }

        function categoryFilter(category) {
            var filteredFoods = []
            var storedFoods = JSON.parse(localStorage.getItem("allRecipes"))

            if (storedFoods != null) {
                for (j = 0; j < storedFoods.length; j++) {
                    if (storedFoods[j] != null) {
                        for (k = 0; k < storedFoods[j].length; k++) {
                            if (storedFoods[j][k].category == category) {
                                filteredFoods.push(storedFoods[j][k])
                            }
                        }
                    }
                }
            }

            document.getElementById("mainDiv").innerHTML = ""

            for (i = 0; i < filteredFoods.length; i++) {
                document.getElementById("mainDiv").innerHTML =
                    document.getElementById("mainDiv").innerHTML +
                    `
                          <div class="card" style="width: 18rem">
                              <img
                              src=${filteredFoods[i].thumbnail}
                              class="card-img-top"
                              alt="..."
                              />
                              <div class="card-body">
                                  <h5 class="card-title">${filteredFoods[i].mealName}</h5>
                                  <p class="card-text">
                                  Category - ${filteredFoods[i].category} <br>
                                  Area - ${filteredFoods[i].area}
                                  </p>
                                  <a
                                      href="#"
                                      class="btn btn-warning"
                                      data-bs-toggle="modal"
                                      data-bs-target="#${filteredFoods[i].id}"
                                      >View Recipe Details</a>
                              </div>
                          </div>`;
                document.body.innerHTML =
                    document.body.innerHTML +
                    `
                          <div class="modal modal-xl fade" id=${filteredFoods[i].id} tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                              <div class="modal-dialog">
                                  <div class="modal-content">
                                      <div class="modal-header">
                                          <h1 class="modal-title fs-5" id="exampleModalLabel">Recipe</h1>
                                          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                      </div>
                                      <div class="modal-body">
                                          Instructions- <br>
                                      ${filteredFoods[i].instructions}
                                      <br><br>
                                      <a href=${filteredFoods[i].youtubeVideo} target = "_blank" class="btn btn-danger">View Recipe
                                      Video</a>
                                      </div>
                                  </div>
                              </div>
                          </div>
                          `;
            }

        }
    </script>
</body>

</html>
